server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API and operations endpoints are proxied to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Server-Sent Events (SSE) streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }


    location = /healthz { proxy_pass http://backend:8000; }
    location = /readyz  { proxy_pass http://backend:8000; }
    location = /metrics { proxy_pass http://backend:8000; }
}
